services:
  db:
    image: postgres:15-alpine
    container_name: uni_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_USER: ${POSTGRES_USER:-uni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uni_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni} -d ${POSTGRES_DB:-university}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: uni_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uni}:${POSTGRES_PASSWORD:-uni_pass}@db:5432/${POSTGRES_DB:-university}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
